<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K0KRRH8DCW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-K0KRRH8DCW');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>昭和ピコピコ防衛隊</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #202020 0%, #050505 70%);
      color: #f5f5f5;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .wrap {
      width: min(96vw, 760px);
      text-align: center;
    }

    .back-link {
      display: inline-block;
      margin: 10px 0 6px;
      color: #fff36d;
      text-decoration: none;
      font-size: 14px;
      text-shadow: 1px 1px 2px #000;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 10px 0 6px;
      font-size: clamp(24px, 5vw, 42px);
      color: #7cff7c;
      text-shadow: 0 0 8px #2cff2c, 3px 3px 0 #000;
      letter-spacing: 0.08em;
    }

    .sub {
      margin: 0 0 12px;
      color: #ddd;
      font-size: 14px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 0 auto 8px;
      font-size: 16px;
      color: #fff36d;
      width: min(100%, 640px);
    }

    canvas {
      width: min(100%, 640px);
      height: auto;
      background: #000;
      border: 4px solid #7cff7c;
      image-rendering: pixelated;
      box-shadow: 0 0 24px rgba(124, 255, 124, 0.35);
      display: block;
      margin: 0 auto;
    }

    .controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 10px;
      width: min(100%, 640px);
      margin-left: auto;
      margin-right: auto;
    }

    .start-game-button {
      display: inline-block;
      min-width: min(100%, 260px);
      margin: 12px auto 0;
      padding: 15px 18px;
      font-size: 18px;
    }

    .start-game-button.is-hidden {
      display: none;
    }

    .sound-button {
      display: inline-block;
      margin: 10px auto 0;
      padding: 9px 16px;
      color: #7cff7c;
      background: rgba(0, 0, 0, 0.62);
      border: 2px solid #7cff7c;
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(124, 255, 124, 0.24);
      font-size: 14px;
    }

    button {
      font-family: inherit;
      font-size: 18px;
      padding: 14px 10px;
      color: #000;
      background: #7cff7c;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 0 #228822;
      cursor: pointer;
      touch-action: manipulation;
      font-weight: bold;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #228822;
    }

    .startBox {
      margin-top: 10px;
      color: #ccc;
      font-size: 13px;
      line-height: 1.6;
    }

    .blink {
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="../index.html">← 昭和レトロゲーム街へ戻る</a>
    <h1>昭和ピコピコ防衛隊</h1>
    <p class="sub">ブラウン管の向こうから、謎のピコピコ軍団がやってきた。</p>

    <div class="hud">
      <div>得点: <span id="score">0</span></div>
      <div>残機: <span id="lives">3</span></div>
      <div>状態: <span id="status">準備中</span></div>
    </div>

    <canvas id="game" width="640" height="480"></canvas>

    <button id="startGameBtn" class="start-game-button" type="button">ゲームスタート</button>
    <button id="soundBtn" class="sound-button" type="button">音 ON</button>

    <div class="controls">
      <button id="leftBtn">← 左</button>
      <button id="rightBtn">右 →</button>
      <button id="shootBtn">発射</button>
    </div>

    <div class="startBox">
      PC操作：← → で移動 ／ Spaceで発射 ／ Enterで開始・再開<br>
      スマホ操作：下のボタンで移動・発射<br>
      <span class="blink">Enter または 発射ボタンで開始</span>
    </div>
  </div>

  <script>
    const GA_GAME_NAME = "???????";

    function trackGaGameStart() {
      if (typeof gtag === "function") {
        gtag("event", "game_start", {
          game_name: GA_GAME_NAME
        });
      }
    }

    function trackGaGameEnd(result, finalScore) {
      if (typeof gtag === "function") {
        const params = { game_name: GA_GAME_NAME, result };
        if (typeof finalScore === "number") params.score = finalScore;
        gtag("event", "game_end", params);
      }
    }

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const statusEl = document.getElementById("status");

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const shootBtn = document.getElementById("shootBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const soundBtn = document.getElementById("soundBtn");

    const keys = {
      left: false,
      right: false,
      shoot: false
    };

    let player;
    let bullets;
    let enemies;
    let enemyBullets;
    let barriers;
    let score;
    let lives;
    let gameState;
    let enemyDirection;
    let enemySpeed;
    let lastShotTime;
    let enemyShotTimer;
    let animationId;
    let bonusCraft = null;
    let nextBonusCraftTime = 0;
    let bonusScorePopups = [];
    let audioCtx = null;
    let masterGain = null;
    let soundEnabled = true;

    function resetGame() {
      trackGaGameStart();
      player = {
        x: canvas.width / 2 - 18,
        y: canvas.height - 50,
        w: 36,
        h: 18,
        speed: 5
      };

      bullets = [];
      enemyBullets = [];
      enemies = [];
      barriers = [];
      score = 0;
      lives = 3;
      gameState = "playing";
      enemyDirection = 1;
      enemySpeed = 0.7;
      lastShotTime = 0;
      enemyShotTimer = 0;
      bonusCraft = null;
      bonusScorePopups = [];

      createEnemies();
      createBarriers();
      scheduleNextBonusCraft();
      updateHud();
      updateStartButton();
      statusEl.textContent = "戦闘中";
    }

    function createEnemies() {
      const rows = 4;
      const cols = 9;
      const startX = 70;
      const startY = 60;
      const gapX = 54;
      const gapY = 42;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: startX + c * gapX,
            y: startY + r * gapY,
            w: 30,
            h: 22,
            alive: true,
            color: r === 0 ? "#ff5c5c" : r === 1 ? "#fff36d" : r === 2 ? "#69b7ff" : "#ff9df2"
          });
        }
      }
    }

    function createBarriers() {
      const count = 5;
      const width = 60;
      const height = 24;
      const cellSize = 6;
      const gap = 50;
      const totalWidth = count * width + (count - 1) * gap;
      const startX = (canvas.width - totalWidth) / 2;

      for (let i = 0; i < count; i++) {
        const cols = Math.floor(width / cellSize);
        const rows = Math.floor(height / cellSize);
        const cells = [];

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const isCornerChip =
              (row === 0 && (col < 2 || col > cols - 3)) ||
              (row === rows - 1 && (col === 0 || col === cols - 1));

            cells.push({
              col,
              row,
              alive: !isCornerChip
            });
          }
        }

        barriers.push({
          x: startX + i * (width + gap),
          y: 350,
          w: width,
          h: height,
          cellSize,
          cols,
          rows,
          cells
        });
      }
    }

    function scheduleNextBonusCraft() {
      nextBonusCraftTime = performance.now() + 18000 + Math.random() * 17000;
    }

    function spawnBonusCraft() {
      if (gameState !== "playing" || bonusCraft) return;

      const direction = Math.random() < 0.5 ? 1 : -1;
      const width = 58;
      bonusCraft = {
        x: direction === 1 ? -width : canvas.width,
        y: 24,
        w: width,
        h: 24,
        speed: 1.25 + Math.random() * 0.65,
        direction,
        active: true,
        hit: false
      };

      playBonusCraftAppearSound();
    }

    function updateBonusCraft() {
      if (gameState !== "playing") {
        bonusCraft = null;
        return;
      }

      if (!bonusCraft) {
        if (performance.now() >= nextBonusCraftTime) {
          spawnBonusCraft();
        }
        return;
      }

      bonusCraft.x += bonusCraft.speed * bonusCraft.direction;

      const passedRight = bonusCraft.direction === 1 && bonusCraft.x > canvas.width;
      const passedLeft = bonusCraft.direction === -1 && bonusCraft.x + bonusCraft.w < 0;
      if (passedRight || passedLeft) {
        bonusCraft = null;
        scheduleNextBonusCraft();
      }
    }

    function getBonusCraftPoints() {
      const roll = Math.random();
      if (roll < 0.35) return 100;
      if (roll < 0.65) return 200;
      if (roll < 0.90) return 300;
      return 500;
    }

    function checkBonusCraftHit(bullet) {
      if (!bonusCraft || !bonusCraft.active || bonusCraft.hit) return false;
      if (!rectHit(bullet, bonusCraft)) return false;

      destroyBonusCraft();
      return true;
    }

    function destroyBonusCraft() {
      if (!bonusCraft || bonusCraft.hit) return;

      bonusCraft.hit = true;
      const points = getBonusCraftPoints();
      score += points;
      updateHud();
      bonusScorePopups.push({
        x: bonusCraft.x + bonusCraft.w / 2,
        y: bonusCraft.y + bonusCraft.h / 2,
        text: `+${points}`,
        life: 90,
        alpha: 1
      });
      playBonusCraftHitSound();
      bonusCraft = null;
      scheduleNextBonusCraft();
    }

    function updateBonusScorePopups() {
      for (const popup of bonusScorePopups) {
        popup.y -= 0.55;
        popup.life--;
        popup.alpha = Math.max(0, popup.life / 90);
      }
      bonusScorePopups = bonusScorePopups.filter((popup) => popup.life > 0);
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
    }

    function drawPixelText(text, x, y, size = 18, color = "#fff") {
      ctx.fillStyle = color;
      ctx.font = `${size}px Courier New`;
      ctx.textAlign = "center";
      ctx.fillText(text, x, y);
    }

    function drawPlayer() {
      ctx.fillStyle = "#7cff7c";
      ctx.fillRect(player.x + 14, player.y - 10, 8, 10);
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillRect(player.x + 6, player.y - 5, 24, 5);
    }

    function drawEnemy(e) {
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x + 8, e.y, 16, 5);
      ctx.fillRect(e.x + 4, e.y + 5, 24, 6);
      ctx.fillRect(e.x, e.y + 11, 30, 8);
      ctx.fillRect(e.x + 5, e.y + 19, 5, 3);
      ctx.fillRect(e.x + 15, e.y + 19, 5, 3);
      ctx.fillRect(e.x + 25, e.y + 19, 5, 3);
      ctx.fillRect(e.x + 3, e.y + 2, 5, 5);
      ctx.fillRect(e.x + 22, e.y + 2, 5, 5);

      ctx.fillStyle = "#000";
      ctx.fillRect(e.x + 9, e.y + 11, 4, 4);
      ctx.fillRect(e.x + 18, e.y + 11, 4, 4);
      ctx.fillStyle = "#fff";
      ctx.fillRect(e.x + 14, e.y + 16, 3, 2);
    }

    function drawBonusCraft() {
      if (!bonusCraft || !bonusCraft.active) return;

      const x = Math.round(bonusCraft.x);
      const y = bonusCraft.y;
      const blink = Math.floor(performance.now() / 160) % 2 === 0;

      ctx.save();
      ctx.fillStyle = "#ffd36b";
      ctx.fillRect(x + 10, y + 5, 38, 14);
      ctx.fillRect(x + 5, y + 9, 48, 8);

      ctx.fillStyle = "#ff8a3d";
      ctx.fillRect(x + 16, y + 1, 8, 6);
      ctx.fillRect(x + 34, y + 1, 8, 6);
      ctx.fillRect(x + 2, y + 11, 7, 4);
      ctx.fillRect(x + 49, y + 11, 7, 4);

      ctx.fillStyle = "#fff4c4";
      ctx.fillRect(x + 20, y + 8, 18, 6);

      ctx.fillStyle = "#4b250f";
      ctx.fillRect(x + 24, y + 10, 4, 3);
      ctx.fillRect(x + 32, y + 10, 4, 3);

      ctx.fillStyle = blink ? "#fff36d" : "#e95b58";
      ctx.fillRect(x + 12, y + 19, 5, 3);
      ctx.fillRect(x + 27, y + 19, 5, 3);
      ctx.fillRect(x + 42, y + 19, 5, 3);

      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff4c4";
      ctx.fillText("ボーナス艇", x + bonusCraft.w / 2, y - 5);
      ctx.restore();
    }

    function drawBonusScorePopups() {
      for (const popup of bonusScorePopups) {
        ctx.save();
        ctx.globalAlpha = popup.alpha;
        ctx.font = "bold 20px Courier New";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff36d";
        ctx.shadowColor = "#ff8a3d";
        ctx.shadowBlur = 10;
        ctx.fillText(popup.text, popup.x, popup.y);
        ctx.restore();
      }
    }

    function drawBullets() {
      ctx.fillStyle = "#fff";
      for (const b of bullets) {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }

      ctx.fillStyle = "#ff5c5c";
      for (const b of enemyBullets) {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
    }

    function drawBarriers() {
      for (const barrier of barriers) {
        for (const cell of barrier.cells) {
          if (!cell.alive) continue;
          const x = barrier.x + cell.col * barrier.cellSize;
          const y = barrier.y + cell.row * barrier.cellSize;
          const flicker = ((cell.col + cell.row) % 3) * 0.04;

          ctx.fillStyle = `rgba(124, 255, 124, ${0.42 + flicker})`;
          ctx.fillRect(x, y, barrier.cellSize - 1, barrier.cellSize - 1);

          if ((cell.col + cell.row) % 4 === 0) {
            ctx.fillStyle = "rgba(255, 243, 109, 0.18)";
            ctx.fillRect(x + 1, y + 1, barrier.cellSize - 3, 2);
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawStars();
      drawBonusCraft();
      drawBarriers();
      drawPlayer();

      for (const e of enemies) {
        if (e.alive) drawEnemy(e);
      }

      drawBullets();
      drawBonusScorePopups();

      if (gameState === "start") {
        drawOverlay("昭和ピコピコ防衛隊", "Enter または 発射で開始");
      }

      if (gameState === "gameover") {
        drawOverlay("ゲームオーバー", "Enter または 発射で再挑戦");
      }

      if (gameState === "clear") {
        drawOverlay("防衛成功！", "Enter または 発射でもう一度");
      }
    }

    function drawStars() {
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      for (let i = 0; i < 55; i++) {
        const x = (i * 97) % canvas.width;
        const y = (i * 53) % canvas.height;
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function drawOverlay(title, message) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawPixelText(title, canvas.width / 2, 220, 34, "#7cff7c");
      drawPixelText(message, canvas.width / 2, 265, 18, "#fff36d");
      drawPixelText(`得点 ${score}`, canvas.width / 2, 305, 18, "#fff");
    }

    function update() {
      if (gameState !== "playing") return;

      if (keys.left) player.x -= player.speed;
      if (keys.right) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      if (keys.shoot) shoot();

      updateBullets();
      updateBonusCraft();
      updateBonusScorePopups();
      updateEnemies();
      updateEnemyShots();
      checkCollisions();
      checkGameState();
    }

    function shoot() {
      const now = performance.now();
      if (now - lastShotTime < 320) return;

      bullets.push({
        x: player.x + player.w / 2 - 2,
        y: player.y - 12,
        w: 4,
        h: 12,
        speed: 7
      });

      lastShotTime = now;
      beep(660, 0.04);
    }

    function updateBullets() {
      for (const b of bullets) b.y -= b.speed;
      bullets = bullets.filter(b => b.y + b.h > 0);

      for (const b of enemyBullets) b.y += b.speed;
      enemyBullets = enemyBullets.filter(b => b.y < canvas.height);
    }

    function updateEnemies() {
      let hitEdge = false;

      for (const e of enemies) {
        if (!e.alive) continue;
        e.x += enemyDirection * enemySpeed;
        if (e.x < 20 || e.x + e.w > canvas.width - 20) hitEdge = true;
      }

      if (hitEdge) {
        enemyDirection *= -1;
        for (const e of enemies) {
          if (e.alive) e.y += 16;
        }
        enemySpeed += 0.05;
      }
    }

    function updateEnemyShots() {
      enemyShotTimer++;
      if (enemyShotTimer < 55) return;
      enemyShotTimer = 0;

      const aliveEnemies = enemies.filter(e => e.alive);
      if (aliveEnemies.length === 0) return;

      const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
      enemyBullets.push({
        x: shooter.x + shooter.w / 2 - 2,
        y: shooter.y + shooter.h,
        w: 4,
        h: 12,
        speed: 4
      });
    }

    function checkCollisions() {
      for (const b of bullets) {
        if (checkBonusCraftHit(b)) {
          b.y = -999;
          continue;
        }

        if (hitBarrier(b)) {
          b.y = -999;
          continue;
        }

        for (const e of enemies) {
          if (!e.alive) continue;
          if (rectHit(b, e)) {
            e.alive = false;
            b.y = -999;
            score += 10;
            updateHud();
            beep(220, 0.05);
            break;
          }
        }
      }

      bullets = bullets.filter(b => b.y > -100);

      for (const b of enemyBullets) {
        if (hitBarrier(b)) {
          b.y = canvas.height + 999;
          continue;
        }

        if (rectHit(b, player)) {
          b.y = canvas.height + 999;
          lives--;
          updateHud();
          beep(110, 0.12);

          if (lives <= 0) {
            gameState = "gameover";
            bonusCraft = null;
            updateStartButton();
            statusEl.textContent = "敗北";
            trackGaGameEnd("gameover", score);
          }
        }
      }
    }

    function hitBarrier(bullet) {
      for (const barrier of barriers) {
        if (!rectHit(bullet, barrier)) continue;

        const hitCell = findBarrierCellHit(bullet, barrier);
        if (hitCell) {
          const hitX = bullet.x + bullet.w / 2;
          const hitY = bullet.y + bullet.h / 2;
          damageBarrierAt(barrier, hitX, hitY, 10);
          beep(150, 0.03);
          return true;
        }
      }
      return false;
    }

    function findBarrierCellHit(bullet, barrier) {
      for (const cell of barrier.cells) {
        if (!cell.alive) continue;

        const cellRect = {
          x: barrier.x + cell.col * barrier.cellSize,
          y: barrier.y + cell.row * barrier.cellSize,
          w: barrier.cellSize,
          h: barrier.cellSize
        };

        if (rectHit(bullet, cellRect)) {
          return cell;
        }
      }
      return null;
    }

    function damageBarrierAt(barrier, x, y, radius) {
      const radiusSq = radius * radius;

      for (const cell of barrier.cells) {
        if (!cell.alive) continue;

        const centerX = barrier.x + cell.col * barrier.cellSize + barrier.cellSize / 2;
        const centerY = barrier.y + cell.row * barrier.cellSize + barrier.cellSize / 2;
        const dx = centerX - x;
        const dy = centerY - y;

        if (dx * dx + dy * dy <= radiusSq) {
          cell.alive = false;
        }
      }
    }

    function checkGameState() {
      const aliveEnemies = enemies.filter(e => e.alive);

      if (aliveEnemies.length === 0) {
        gameState = "clear";
        bonusCraft = null;
        updateStartButton();
        statusEl.textContent = "防衛成功";
        trackGaGameEnd("clear", score);
        return;
      }

      for (const e of aliveEnemies) {
        if (e.y + e.h >= player.y) {
          gameState = "gameover";
          bonusCraft = null;
          updateStartButton();
          statusEl.textContent = "侵略完了";
          trackGaGameEnd("gameover", score);
          return;
        }
      }
    }

    function rectHit(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function loop() {
      update();
      draw();
      animationId = requestAnimationFrame(loop);
    }

    function startOrRestart() {
      if (gameState === "playing") {
        keys.shoot = true;
        shoot();
        setTimeout(() => keys.shoot = false, 80);
        return;
      }
      resetGame();
    }

    function updateStartButton() {
      if (gameState === "playing") {
        startGameBtn.classList.add("is-hidden");
        return;
      }

      startGameBtn.classList.remove("is-hidden");
      startGameBtn.textContent = gameState === "start" ? "ゲームスタート" : "もう一度遊ぶ";
    }

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;

          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.08;
          masterGain.connect(audioCtx.destination);
        }

        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      } catch (e) {
        console.log("Audio init failed", e);
      }
    }

    function beep(freq, duration) {
      if (!soundEnabled) return;

      try {
        initAudio();

        if (!audioCtx || !masterGain) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {
        console.log("Beep failed", e);
      }
    }

    function playBonusToneSequence(notes, type = "square") {
      if (!soundEnabled) return;

      try {
        initAudio();
        if (!audioCtx || !masterGain) return;

        const startTime = audioCtx.currentTime;
        for (const note of notes) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const noteStart = startTime + note.delay;
          const noteEnd = noteStart + note.duration;

          osc.type = type;
          osc.frequency.setValueAtTime(note.freq, noteStart);
          gain.gain.setValueAtTime(0.035, noteStart);
          gain.gain.exponentialRampToValueAtTime(0.001, noteEnd);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(noteStart);
          osc.stop(noteEnd);
        }
      } catch (e) {
        console.log("Bonus sound failed", e);
      }
    }

    function playBonusCraftAppearSound() {
      playBonusToneSequence([
        { freq: 420, delay: 0, duration: 0.07 },
        { freq: 620, delay: 0.09, duration: 0.08 }
      ]);
    }

    function playBonusCraftHitSound() {
      playBonusToneSequence([
        { freq: 520, delay: 0, duration: 0.07 },
        { freq: 760, delay: 0.07, duration: 0.08 },
        { freq: 980, delay: 0.15, duration: 0.11 }
      ], "triangle");
    }

    function updateSoundButton() {
      soundBtn.textContent = soundEnabled ? "音 ON" : "音 OFF";
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.key === "Enter") {
        initAudio();
      }
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if (e.code === "Space") {
        e.preventDefault();
        if (gameState === "playing") keys.shoot = true;
        else startOrRestart();
      }
      if (e.key === "Enter") startOrRestart();
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
      if (e.code === "Space") keys.shoot = false;
    });

    function bindHold(button, keyName) {
      button.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        initAudio();
        keys[keyName] = true;
        if (keyName === "shoot") startOrRestart();
      });

      button.addEventListener("pointerup", () => keys[keyName] = false);
      button.addEventListener("pointerleave", () => keys[keyName] = false);
      button.addEventListener("pointercancel", () => keys[keyName] = false);
    }

    bindHold(leftBtn, "left");
    bindHold(rightBtn, "right");
    bindHold(shootBtn, "shoot");
    startGameBtn.addEventListener("pointerdown", () => {
      initAudio();
    });
    startGameBtn.addEventListener("click", () => {
      initAudio();
      startOrRestart();
    });
    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) initAudio();
      updateSoundButton();
    });
    canvas.addEventListener("pointerdown", () => {
      initAudio();
    });
    canvas.addEventListener("touchstart", () => {
      initAudio();
    }, { passive: true });
    shootBtn.addEventListener("touchstart", () => {
      initAudio();
    }, { passive: true });
    startGameBtn.addEventListener("touchstart", () => {
      initAudio();
    }, { passive: true });
    soundBtn.addEventListener("pointerdown", () => {
      initAudio();
    });

    gameState = "start";
    player = { x: canvas.width / 2 - 18, y: canvas.height - 50, w: 36, h: 18, speed: 5 };
    bullets = [];
    enemies = [];
    enemyBullets = [];
    barriers = [];
    score = 0;
    lives = 3;
    updateHud();
    createBarriers();
    updateStartButton();
    updateSoundButton();
    statusEl.textContent = "待機中";
    loop();
  </script>
</body>
</html>
